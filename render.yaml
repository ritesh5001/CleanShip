# Render Blueprint — the CleanTrack API.
#
# WHAT DEPLOYS WHERE
#
#   backend/   → Render, as the web service below. It is the API: Postgres,
#                auth, vessels, the status grid, the audit trail.
#   frontend/  → Vercel. It is the Next.js site and the CleanTrack screens,
#                and it calls this service over HTTPS.
#
# The two share exactly one secret, SESSION_SECRET, because the frontend
# verifies the session tokens this service signs instead of asking it who the
# user is on every page render. Set the SAME value in both places or every
# sign-in will appear to work and then bounce straight back to the login page.
#
# FIRST DEPLOY, in order:
#   1. Apply this blueprint (or create the service by hand with the settings
#      below). It creates the database and the API.
#   2. Set SESSION_SECRET when prompted — `openssl rand -base64 48`.
#   3. Set CLEANTRACK_URL to the public site, e.g.
#      https://cleantrack.cleanship.co — customer share links are built from
#      it, so a wrong value sends every link you issue to the wrong host.
#   4. In the Render shell (or locally against the same DATABASE_URL), run
#      `npm run seed` once to create the first admin. It prints a temporary
#      password to the log exactly once.
#   5. On Vercel, set BACKEND_URL to this service's URL and SESSION_SECRET to
#      the same value from step 2.
#
# Migrations run in the build command, so every deploy brings the schema
# forward. The runner records what it applied and is safe to re-run.

databases:
  - name: cleanship-db
    databaseName: cleanship
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: cleanship-api
    runtime: node
    plan: starter
    # The API is its own package. Render installs and builds inside it, so
    # the Next app in frontend/ is never downloaded or compiled here.
    rootDir: backend
    # `npm ci` needs backend/package-lock.json, which exists because
    # backend/ is a standalone package rather than a workspace member — that
    # is what lets Render install this and nothing else.
    buildCommand: npm ci && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cleanship-db
          property: connectionString
      # `sync: false` makes Render prompt for these rather than storing
      # secrets and per-environment URLs in a file that is in git.
      - key: SESSION_SECRET
        sync: false
      - key: CLEANTRACK_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
