# Render Blueprint — the CleanTrack API.
#
# WHAT DEPLOYS WHERE
#
#   backend/   → Render, as the web service below. It is the API: auth,
#                vessels, the status grid, the audit trail. The only thing
#                that talks to Postgres.
#   frontend/  → Vercel. The Next.js site plus the CleanTrack screens, served
#                on www.cleanship.co and cleantrack.cleanship.co, calling this
#                service over HTTPS.
#
# THE DATABASE IS NOT MANAGED HERE.
#
# Postgres is Neon, provisioned outside Render, and DATABASE_URL is pasted
# into the service by hand. There is deliberately no `databases:` block: one
# would make Render provision a SECOND, empty Postgres and wire the API to it,
# and the first symptom would be a working deploy with no vessels and no
# accounts in it — which reads like data loss and is not.
#
# The two apps share exactly one secret, SESSION_SECRET, because the frontend
# verifies the session tokens this service signs instead of asking it who the
# user is on every page render. Set the SAME value in both places or every
# sign-in will appear to work and then bounce straight back to the login page.
#
# ---------------------------------------------------------------------------
# FIRST DEPLOY, in order
# ---------------------------------------------------------------------------
#
# 1. Apply this blueprint, or create a web service by hand with the settings
#    below. Render will prompt for the `sync: false` variables.
#
# 2. Paste these in:
#
#      DATABASE_URL     the Neon POOLED connection string, keeping
#                       ?sslmode=require — src/db/index.ts keys its TLS
#                       settings off that string.
#      SESSION_SECRET   the same value that is set on Vercel.
#      CLEANTRACK_URL   https://cleantrack.cleanship.co
#      CORS_ORIGINS     https://cleantrack.cleanship.co,https://www.cleanship.co,https://cleanship.co
#
# 3. The build runs `npm run migrate`, so the schema comes forward on every
#    deploy. Nothing to do by hand.
#
# 4. `npm run seed` creates the first admin. It is idempotent — if
#    admin@cleanship.co already exists it leaves the account and its password
#    alone rather than resetting them, so it is safe to re-run.
#
# 5. On Vercel set BACKEND_URL to this service's URL, SESSION_SECRET to the
#    same value as step 2, and COOKIE_DOMAIN to `.cleanship.co` — the leading
#    dot is what lets one sign-in work on the site and the subdomain alike.
#
# Adding variables does not trigger a rebuild on either host. Redeploy after.

services:
  - type: web
    name: cleanship-api
    runtime: node
    plan: starter
    # The API is a standalone package with its own lockfile, which is what
    # lets Render install and build this and nothing else — the Next app in
    # frontend/ is never downloaded or compiled here.
    rootDir: backend
    buildCommand: npm ci && npm run build
    # Migrations run here, not in the build.
    #
    # A blueprint does NOT reconfigure a service that was created by hand in
    # the dashboard, so a `npm run migrate` in buildCommand above is only
    # applied to services created FROM this file. That is exactly how the
    # cells.started_at column came to be missing in production while the code
    # that reads it was live: the build command in the dashboard stopped at
    # `npm run build`, and nothing said so until the first 500.
    #
    # Putting it in the start command means it cannot be skipped by a
    # dashboard field being out of date. It runs from compiled JS, so it needs
    # no devDependencies, and it takes an advisory lock so two instances
    # starting together cannot race. A failed migration stops the service from
    # starting, which is louder and safer than serving 500s against a schema
    # that is behind the code.
    startCommand: npm start
    # Reports the database too. A service that answers 200 while unable to
    # reach Postgres looks healthy on the dashboard and is useless to
    # everyone using it.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # `sync: false` makes Render prompt for these rather than keeping
      # credentials and per-environment URLs in a file that is in git.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLEANTRACK_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
