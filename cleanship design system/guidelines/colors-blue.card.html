<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:1px solid var(--border-subtle)}.tok{font:var(--type-mono);color:var(--text-muted);font-size:11px}.nm{font:var(--fw-semibold) 12px/1 var(--font-body);color:var(--text-strong)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--blue-600)"></div><span class="nm">Blue 600</span><span class="tok">--blue-600</span><span class="tok">#1461a0</span></div><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><span class="nm">Blue 500</span><span class="tok">--blue-500</span><span class="tok">#1b7bc4</span></div><div class="sw"><div class="chip" style="background:var(--blue-400)"></div><span class="nm">Blue 400</span><span class="tok">--blue-400</span><span class="tok">#4a9bd8</span></div><div class="sw"><div class="chip" style="background:var(--blue-200)"></div><span class="nm">Blue 200</span><span class="tok">--blue-200</span><span class="tok">#b7d6ee</span></div><div class="sw"><div class="chip" style="background:var(--blue-100)"></div><span class="nm">Blue 100</span><span class="tok">--blue-100</span><span class="tok">#dceaf6</span></div><div class="sw"><div class="chip" style="background:var(--blue-50)"></div><span class="nm">Blue 50</span><span class="tok">--blue-50</span><span class="tok">#f1f7fc</span></div>
</div></body></html>
