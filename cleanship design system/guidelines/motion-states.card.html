<!-- @dsCard group="Brand" viewport="700x180" name="Motion & interaction states" subtitle="140–220ms flat easing, -2px hover lift, .985 press" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}</style></head>
<body>
<div class="row">
<div><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--blue-600);color:#fff;font:var(--fw-semibold) 14px/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase">Rest</div><div class="lbl" style="margin-top:6px">--blue-600</div></div>
<div><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--navy-700);color:#fff;font:var(--fw-semibold) 14px/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase">Hover</div><div class="lbl" style="margin-top:6px">darkens to navy</div></div>
<div><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--navy-700);color:#fff;transform:scale(.985);font:var(--fw-semibold) 14px/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase">Press</div><div class="lbl" style="margin-top:6px">scale .985</div></div>
<div><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--white);border:1px solid var(--blue-500);box-shadow:var(--focus-ring);font:var(--fw-semibold) 14px/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--blue-600)">Focus</div><div class="lbl" style="margin-top:6px">--focus-ring</div></div>
</div>
<div class="lbl" style="margin-top:16px">--dur-fast 140ms UI · --dur-base 220ms surfaces · --dur-photo 700ms image scale · --ease-standard, --ease-out · no bounce, no spring</div>
</body></html>
