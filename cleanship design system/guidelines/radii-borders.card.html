<!-- @dsCard group="Brand" viewport="700x160" name="Radii & borders" subtitle="Near-square corners; 1px cool borders; 3px aqua accent rule" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}</style></head>
<body><div class="row">
<div style="text-align:center"><div style="width:74px;height:56px;background:var(--blue-50);border:1px solid var(--border-default);border-radius:var(--radius-none)"></div><div class="lbl" style="margin-top:6px">none · 0px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--blue-50);border:1px solid var(--border-default);border-radius:var(--radius-xs)"></div><div class="lbl" style="margin-top:6px">xs · 2px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--blue-50);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div class="lbl" style="margin-top:6px">sm · 3px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--blue-50);border:1px solid var(--border-default);border-radius:var(--radius-md)"></div><div class="lbl" style="margin-top:6px">md · 4px</div></div><div style="text-align:center"><div style="width:74px;height:56px;background:var(--blue-50);border:1px solid var(--border-default);border-radius:var(--radius-lg)"></div><div class="lbl" style="margin-top:6px">lg · 6px</div></div>
<div style="text-align:center"><div style="width:74px;height:56px;background:var(--white);border:1px solid var(--border-default);border-top:3px solid var(--aqua-500)"></div><div class="lbl" style="margin-top:6px">accent rule</div></div>
<div style="text-align:center"><div style="width:90px;height:24px;border-radius:var(--radius-pill);background:var(--blue-100)"></div><div class="lbl" style="margin-top:6px">pill · badges only</div></div>
</div></body></html>
