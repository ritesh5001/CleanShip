<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Form validation and operational states only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:1px solid var(--border-subtle)}.tok{font:var(--type-mono);color:var(--text-muted);font-size:11px}.nm{font:var(--fw-semibold) 12px/1 var(--font-body);color:var(--text-strong)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--success-600)"></div><span class="nm">Success</span><span class="tok">--success-600</span><span class="tok">#1e9e63</span></div><div class="sw"><div class="chip" style="background:var(--success-100)"></div><span class="nm">Success bg</span><span class="tok">--success-100</span><span class="tok">#e2f4ea</span></div><div class="sw"><div class="chip" style="background:var(--warning-600)"></div><span class="nm">Warning</span><span class="tok">--warning-600</span><span class="tok">#c9880d</span></div><div class="sw"><div class="chip" style="background:var(--warning-100)"></div><span class="nm">Warning bg</span><span class="tok">--warning-100</span><span class="tok">#fbf0d8</span></div><div class="sw"><div class="chip" style="background:var(--danger-600)"></div><span class="nm">Danger</span><span class="tok">--danger-600</span><span class="tok">#c6472f</span></div><div class="sw"><div class="chip" style="background:var(--danger-100)"></div><span class="nm">Danger bg</span><span class="tok">--danger-100</span><span class="tok">#fae5e0</span></div>
</div></body></html>
