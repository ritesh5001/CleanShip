<!-- @dsCard group="Colors" viewport="700x150" name="Aqua — clean-water accent" subtitle="Used sparingly: rules, active states, counter suffixes" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:1px solid var(--border-subtle)}.tok{font:var(--type-mono);color:var(--text-muted);font-size:11px}.nm{font:var(--fw-semibold) 12px/1 var(--font-body);color:var(--text-strong)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--aqua-600)"></div><span class="nm">Aqua 600</span><span class="tok">--aqua-600</span><span class="tok">#00929b</span></div><div class="sw"><div class="chip" style="background:var(--aqua-500)"></div><span class="nm">Aqua 500</span><span class="tok">--aqua-500</span><span class="tok">#00b0b9</span></div><div class="sw"><div class="chip" style="background:var(--aqua-200)"></div><span class="nm">Aqua 200</span><span class="tok">--aqua-200</span><span class="tok">#9de3e7</span></div>
</div></body></html>
