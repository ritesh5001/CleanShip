<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}</style></head>
<body>
<span class="cs-eyebrow">Our Services</span>
<div style="margin-top:16px;font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--slate-600)">Phone Number:</div>
<div style="margin-top:10px;font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--blue-600)">Read more · badge / micro label 11px</div>
<div class="lbl" style="margin-top:14px">--ls-eyebrow .18em · --ls-label .08em</div>
</body></html>
