<!-- @dsCard group="Colors" viewport="700x170" name="Photo scrims" subtitle="Navy overlays for photography — never black" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
<div><div style="height:88px;background:var(--navy-600)"><div style="height:100%;background:var(--scrim-navy)"></div></div><div class="lbl" style="margin-top:6px">--scrim-navy</div></div>
<div><div style="height:88px;background:var(--navy-600)"><div style="height:100%;background:var(--scrim-navy-left)"></div></div><div class="lbl" style="margin-top:6px">--scrim-navy-left</div></div>
<div><div style="height:88px;background:var(--navy-600)"><div style="height:100%;background:var(--scrim-flat)"></div></div><div class="lbl" style="margin-top:6px">--scrim-flat</div></div>
</div></body></html>
