<!-- @dsCard group="Colors" viewport="700x150" name="Cool neutrals" subtitle="Text and lines — never warm grey" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--white);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-faint)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:1px solid var(--border-subtle)}.tok{font:var(--type-mono);color:var(--text-muted);font-size:11px}.nm{font:var(--fw-semibold) 12px/1 var(--font-body);color:var(--text-strong)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
<div class="sw"><div class="chip" style="background:var(--ink-900)"></div><span class="nm">Ink 900</span><span class="tok">--ink-900</span><span class="tok">#0f1c27</span></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><span class="nm">Ink 700</span><span class="tok">--ink-700</span><span class="tok">#243545</span></div><div class="sw"><div class="chip" style="background:var(--slate-600)"></div><span class="nm">Slate 600</span><span class="tok">--slate-600</span><span class="tok">#4c5c6b</span></div><div class="sw"><div class="chip" style="background:var(--slate-400)"></div><span class="nm">Slate 400</span><span class="tok">--slate-400</span><span class="tok">#8a9aa8</span></div><div class="sw"><div class="chip" style="background:var(--line-200)"></div><span class="nm">Line 200</span><span class="tok">--line-200</span><span class="tok">#dce4eb</span></div><div class="sw"><div class="chip" style="background:var(--paper)"></div><span class="nm">Paper</span><span class="tok">--paper</span><span class="tok">#f6f8fa</span></div>
</div></body></html>
